[package]
name = "caj2pdf-cli"
version = "0.5.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
description = "Native command-line interface for caj2pdf"
repository = "https://github.com/rwv/caj2pdf-rust"
publish = ["crates-io"]
readme = "../../README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "caj2pdf"
path = "src/main.rs"

[dependencies]
caj2pdf-core = { version = "0.5.0", path = "../caj2pdf-core" }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4", default-features = false }

[target."cfg(windows)".dependencies]
ctrlc = "3.5.2"
winapi-util = "0.1.11"

[target."cfg(any(unix, windows))".dependencies]
same-file = "1.0.6"
tempfile = { version = "3.27.0", default-features = false }

[dev-dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
sha2 = { version = "0.11.0", default-features = false }
