[package]
name = "caj2pdf-core"
version = "0.6.2"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
description = "Platform-neutral CAJ-family conversion core"
repository = "https://github.com/rwv/caj2pdf-rust"
publish = ["crates-io"]
readme = "../../README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
path = "src/lib.rs"

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
sha2 = { version = "0.11.0", default-features = false }
xberg-ttf-parser = { version = "1.1.0", default-features = false, features = ["std"] }
