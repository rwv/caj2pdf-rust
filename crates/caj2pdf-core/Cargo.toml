[package]
name = "caj2pdf-core"
version = "0.6.1"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
description = "Platform-neutral CAJ-family conversion core"
repository = "https://github.com/rwv/caj2pdf-rust"
publish = ["crates-io"]
readme = "../../README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
path = "src/lib.rs"

[dependencies]
aes = { version = "=0.9.2", features = ["zeroize"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
md-5 = { version = "0.11.0", default-features = false }
quick-xml = { version = "0.42.0", default-features = false }
sha1 = { version = "0.11.0", default-features = false }
zeroize = { version = "1.8.2", default-features = false, features = ["alloc"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
sha2 = { version = "0.11.0", default-features = false }
xberg-ttf-parser = { version = "1.1.0", default-features = false, features = ["std"] }
