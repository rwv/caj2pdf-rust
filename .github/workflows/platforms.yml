name: Native platforms
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platforms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-musl}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
          - {runner: macos-15-intel, target: x86_64-apple-darwin}
          - {runner: macos-15, target: aarch64-apple-darwin}
          - {runner: windows-2025, target: x86_64-pc-windows-msvc}
          - {runner: windows-11-arm, target: aarch64-pc-windows-msvc}
          - {runner: windows-2025, target: i686-pc-windows-msvc}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned toolchain and target
        run: |
          rustup show active-toolchain
          rustup target add '${{ matrix.target }}'
          if [[ "$RUNNER_OS" == Windows ]]; then echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"; fi
      - name: Install Linux validators and musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qpdf mupdf-tools musl-tools
      - name: Install macOS validators
        if: runner.os == 'macOS'
        run: brew install qpdf mupdf-tools
      - name: Install Windows validators
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-windows-test-tools.ps1
      - name: Check target code quality
        run: cargo clippy --locked -p caj2pdf-cli --all-targets --target '${{ matrix.target }}' -- -D warnings
      - name: Test core on target
        run: cargo test --locked -p caj2pdf-core --lib --target '${{ matrix.target }}'
      - name: Test portable CLI on target
        run: cargo test --locked -p caj2pdf-cli --test portable --target '${{ matrix.target }}'
      - name: Build and package tested release binary
        run: |
          cargo build --locked --release -p caj2pdf-cli --target '${{ matrix.target }}'
          cargo test --locked --release -p caj2pdf-cli --test portable --target '${{ matrix.target }}'
          binary='target/${{ matrix.target }}/release/caj2pdf'
          if [[ '${{ runner.os }}' == Windows ]]; then binary="$binary.exe"; fi
          python scripts/package-native.py --target '${{ matrix.target }}' --binary "$binary"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  linux-cross:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: i686-unknown-linux-gnu, libc: i386, compiler: i686-linux-gnu, qemu: i386}
          - {target: armv7-unknown-linux-gnueabihf, libc: armhf, compiler: arm-linux-gnueabihf, qemu: arm}
          - {target: riscv64gc-unknown-linux-gnu, libc: riscv64, compiler: riscv64-linux-gnu, qemu: riscv64}
          - {target: powerpc64le-unknown-linux-gnu, libc: ppc64el, compiler: powerpc64le-linux-gnu, qemu: ppc64le}
          - {target: s390x-unknown-linux-gnu, libc: s390x, compiler: s390x-linux-gnu, qemu: s390x}
          - {target: armv5te-unknown-linux-gnueabi, libc: armel, compiler: arm-linux-gnueabi, qemu: arm, cpu: "arm926"}
          - {target: arm-unknown-linux-gnueabi, libc: armel, compiler: arm-linux-gnueabi, qemu: arm, cpu: "arm1176"}
          - {target: arm-unknown-linux-gnueabihf, libc: armhf, compiler: arm-linux-gnueabihf, qemu: arm, cpu: "arm1176"}
          - {target: armv7-unknown-linux-gnueabi, libc: armel, compiler: arm-linux-gnueabi, qemu: arm, cpu: "cortex-a9"}
          - {target: powerpc-unknown-linux-gnu, libc: powerpc, compiler: powerpc-linux-gnu, qemu: ppc, cpu: ""}
          - {target: powerpc64-unknown-linux-gnu, libc: ppc64, compiler: powerpc64-linux-gnu, qemu: ppc64, cpu: ""}
          - {target: sparc64-unknown-linux-gnu, libc: sparc64, compiler: sparc64-linux-gnu, qemu: sparc64, cpu: ""}
          - {target: loongarch64-unknown-linux-gnu, libc: loong64, compiler: loongarch64-unknown-linux-gnu, qemu: loongarch64, cpu: ""}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cross compiler and emulator
        env:
          TARGET: ${{ matrix.target }}
          COMPILER: ${{ matrix.compiler }}
          QEMU: ${{ matrix.qemu }}
          CPU: ${{ matrix.cpu }}
        run: |
          rustup show active-toolchain
          rustup target add "$TARGET"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user qpdf mupdf-tools
          if [[ "$TARGET" == loongarch64-unknown-linux-gnu ]]; then
            archive=x86_64-cross-tools-loongarch64-binutils_2.45-gcc_15.1.0-glibc_2.42.tar.xz
            curl --fail --location --retry 3 "https://github.com/loongson/build-tools/releases/download/2025.08.08/$archive" -o "$RUNNER_TEMP/$archive"
            echo "b8572e2083143ff1807658f02e11eba53e5ed81d6194854d369b43fceea72de7  $RUNNER_TEMP/$archive" | sha256sum -c -
            tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/cross-tools/bin" >> "$GITHUB_PATH"
            sysroot="$("$RUNNER_TEMP/cross-tools/bin/$COMPILER-gcc" -print-sysroot)"
          elif [[ "$TARGET" == arm-unknown-linux-gnueabihf ]]; then
            stem=armv6-eabihf--glibc--stable-2025.08-1
            curl --fail --location --retry 3 "https://toolchains.bootlin.com/downloads/releases/toolchains/armv6-eabihf/tarballs/$stem.tar.xz" -o "$RUNNER_TEMP/armv6.tar.xz"
            echo "062c148a62785ce583f32e2e69bb1e8fc5dbb598bf4baacce0df118de4066de8  $RUNNER_TEMP/armv6.tar.xz" | sha256sum -c -
            tar -xJf "$RUNNER_TEMP/armv6.tar.xz" -C "$RUNNER_TEMP"
            toolchain="$RUNNER_TEMP/$stem"
            "$toolchain/relocate-sdk.sh"
            COMPILER=arm-buildroot-linux-gnueabihf
            echo "$toolchain/bin" >> "$GITHUB_PATH"
            sysroot="$("$toolchain/bin/$COMPILER-gcc" -print-sysroot)"
          else
            sudo apt-get install --no-install-recommends -y "gcc-$COMPILER" "libc6-dev-${{ matrix.libc }}-cross"
            sysroot="/usr/$COMPILER"
          fi
          if [[ "$QEMU" == loongarch64 ]]; then bash scripts/install-loongarch-qemu.sh; fi
          runner="qemu-$QEMU"
          if [[ -n "$CPU" ]]; then runner+=" -cpu $CPU"; fi
          runner+=" -L $sysroot"
          key="$(echo "$TARGET" | tr '[:lower:]-' '[:upper:]_')"
          echo "CARGO_TARGET_${key}_LINKER=$COMPILER-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${key}_RUNNER=$runner" >> "$GITHUB_ENV"
          echo "CAJ2PDF_TEST_RUNNER=$runner" >> "$GITHUB_ENV"
      - name: Run core and CLI tests under QEMU
        run: |
          cargo test --locked --release -p caj2pdf-core --lib --target '${{ matrix.target }}'
          cargo test --locked --release -p caj2pdf-cli --test portable --target '${{ matrix.target }}'
      - name: Package tested cross binary
        run: python scripts/package-native.py --target '${{ matrix.target }}' --binary 'target/${{ matrix.target }}/release/caj2pdf'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  linux-musl:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: loongarch64-unknown-linux-musl, qemu: loongarch64, cpu: ""}
          - {target: armv5te-unknown-linux-musleabi, qemu: arm, cpu: "arm926"}
          - {target: arm-unknown-linux-musleabi, qemu: arm, cpu: "arm1176"}
          - {target: arm-unknown-linux-musleabihf, qemu: arm, cpu: "arm1176"}
          - {target: armv7-unknown-linux-musleabi, qemu: arm, cpu: "cortex-a9"}
          - {target: armv7-unknown-linux-musleabihf, qemu: arm, cpu: "cortex-a9"}
          - {target: i586-unknown-linux-musl, qemu: i386, cpu: "pentium"}
          - {target: i686-unknown-linux-musl, qemu: i386, cpu: ""}
          - {target: powerpc64-unknown-linux-musl, qemu: ppc64, cpu: ""}
          - {target: powerpc64le-unknown-linux-musl, qemu: ppc64le, cpu: ""}
          - {target: riscv64gc-unknown-linux-musl, qemu: riscv64, cpu: ""}
    env:
      RUSTFLAGS: '-C linker=rust-lld -C target-feature=+crt-static -C link-self-contained=yes'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install target and emulator
        env:
          TARGET: ${{ matrix.target }}
          QEMU: ${{ matrix.qemu }}
          CPU: ${{ matrix.cpu }}
        run: |
          rustup show active-toolchain
          rustup target add "$TARGET"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user qpdf mupdf-tools
          key="$(echo "$TARGET" | tr '[:lower:]-' '[:upper:]_')"
          if [[ "$QEMU" == loongarch64 ]]; then bash scripts/install-loongarch-qemu.sh; fi
          runner="qemu-$QEMU"
          if [[ -n "$CPU" ]]; then runner+=" -cpu $CPU"; fi
          echo "CARGO_TARGET_${key}_RUNNER=$runner" >> "$GITHUB_ENV"
          echo "CAJ2PDF_TEST_RUNNER=$runner" >> "$GITHUB_ENV"
      - name: Test static core and CLI under QEMU
        run: |
          cargo test --locked --release -p caj2pdf-core --lib --target '${{ matrix.target }}'
          cargo test --locked --release -p caj2pdf-cli --test portable --target '${{ matrix.target }}'
      - name: Package tested static binary
        run: python scripts/package-native.py --target '${{ matrix.target }}' --binary 'target/${{ matrix.target }}/release/caj2pdf'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  mips:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: mips-unknown-linux-gnu, compiler: mips-linux-gnu, libc: mips, qemu: mips}
          - {target: mipsel-unknown-linux-gnu, compiler: mipsel-linux-gnu, libc: mipsel, qemu: mipsel}
          - {target: mips64-unknown-linux-gnuabi64, compiler: mips64-linux-gnuabi64, libc: mips64, qemu: mips64}
          - {target: mips64el-unknown-linux-gnuabi64, compiler: mips64el-linux-gnuabi64, libc: mips64el, qemu: mips64el}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned std builder and cross sysroot
        env:
          TARGET: ${{ matrix.target }}
          COMPILER: ${{ matrix.compiler }}
          QEMU: ${{ matrix.qemu }}
        run: |
          rustup toolchain install nightly-2026-09-29 --profile minimal --component rust-src
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y "gcc-$COMPILER" "libc6-dev-${{ matrix.libc }}-cross" qemu-user qpdf mupdf-tools
          key="$(echo "$TARGET" | tr '[:lower:]-' '[:upper:]_')"
          echo "CARGO_TARGET_${key}_LINKER=$COMPILER-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${key}_RUNNER=qemu-$QEMU -L /usr/$COMPILER" >> "$GITHUB_ENV"
          echo "CAJ2PDF_TEST_RUNNER=qemu-$QEMU -L /usr/$COMPILER" >> "$GITHUB_ENV"
      - name: Build std and execute actual tests
        run: |
          cargo +nightly-2026-09-29 test -Z build-std --locked --release -p caj2pdf-core --lib --target '${{ matrix.target }}'
          cargo +nightly-2026-09-29 test -Z build-std --locked --release -p caj2pdf-cli --test portable --target '${{ matrix.target }}'
          python scripts/package-native.py --target '${{ matrix.target }}' --binary 'target/${{ matrix.target }}/release/caj2pdf'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  freebsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, target: x86_64-unknown-freebsd}
          - {arch: aarch64, target: aarch64-unknown-freebsd}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and test in FreeBSD 14.3
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1 at adoption
        with:
          release: '14.3'
          arch: ${{ matrix.arch }}
          usesh: true
          mem: 4096
          cpu: 2
          cache-after-prepare: true
          prepare: pkg install -y rust python311 qpdf mupdf
          run: |
            set -eu
            rustc --version
            cargo --version
            cargo test --locked -p caj2pdf-core --lib
            cargo test --locked --release -p caj2pdf-cli --test portable
            python3.11 scripts/package-native.py --target '${{ matrix.target }}' --binary target/release/caj2pdf
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  docker:
    needs: [native, linux-musl]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          merge-multiple: true
          path: native-assets/
      - name: Install big-endian PowerPC container emulator
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-ppc64
          cat /proc/sys/fs/binfmt_misc/qemu-ppc64
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 # qemu-v10.2.3-68
          platforms: all
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build exact OCI archive from tested static binaries
        run: |
          python3 scripts/prepare-docker.py native-assets
          mkdir -p dist
          platforms="$(python3 -c 'import json; print(",".join(json.load(open("docs/container-platforms.json"))))')"
          docker buildx build --platform "$platforms" --provenance=false --output type=oci,dest=dist/caj2pdf-container.oci.tar docker
      - name: Test every platform from the OCI archive
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo qpdf
          bash scripts/test-docker.sh dist/caj2pdf-container.oci.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-assets
          path: dist/
          if-no-files-found: error
