name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      npm_recovery_tag:
        description: 'Published GitHub release tag whose missing npm upload should be recovered'
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'js/test/package.test.mjs'
      - 'docs/releases/**'
      - '.github/workflows/platforms.yml'
      - 'scripts/package-native.py'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml

  platforms:
    needs: quality
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/platforms.yml

  assets:
    needs: quality
    if: always() && (needs.quality.result == 'success' || github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    env:
      CAJ2PDF_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate release version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          version = json.loads(Path('js/package.json').read_text())['version']
          for path in Path('crates').glob('*/Cargo.toml'):
              assert tomllib.loads(path.read_text())['package']['version'] == version
          if os.environ['RELEASE_REF'].startswith('refs/tags/'):
              assert os.environ['RELEASE_REF'] == f'refs/tags/v{version}'
          assert Path(f'docs/releases/v{version}.md').is_file()
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'RELEASE_VERSION={version}\n')
          PY
      - name: Build locked release artifacts
        run: |
          rustup show active-toolchain
          cargo build --locked --release --all-features -p caj2pdf-wasm --target wasm32-unknown-unknown
          node js/scripts/copy-wasm.mjs
          mkdir -p dist
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qpdf
      - name: Test and retain the actual npm tarball
        env:
          CAJ2PDF_PACKAGE_OUTPUT: ${{ github.workspace }}/dist/caj2pdf-rust-${{ env.RELEASE_VERSION }}.tgz
        run: node --test js/test/package.test.mjs
      - name: Retain WASM and release documents
        run: |
          cp js/caj2pdf_wasm.wasm dist/
          cp LICENSE dist/
          cp "docs/releases/v${RELEASE_VERSION}.md" dist/RELEASE-NOTES.md
      - name: Retain tested assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    needs: [assets, platforms]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-assets
          path: dist/
      - name: Publish tested OCI archive to GHCR
        id: container
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
          skopeo copy --all --dest-creds "$REGISTRY_USER:$REGISTRY_TOKEN" --digestfile dist/CONTAINER-DIGEST.txt oci-archive:dist/caj2pdf-container.oci.tar "docker://ghcr.io/rwv/caj2pdf-rust:$RELEASE_TAG"
          skopeo inspect --raw --creds "$REGISTRY_USER:$REGISTRY_TOKEN" "docker://ghcr.io/rwv/caj2pdf-rust:$RELEASE_TAG" > "$RUNNER_TEMP/container-manifest.json"
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          raw = (Path(os.environ['RUNNER_TEMP']) / 'container-manifest.json').read_bytes()
          manifest = json.loads(raw)
          expected = set(json.loads(Path('docs/container-platforms.json').read_text()))
          actual = set()
          for item in manifest['manifests']:
              p = item['platform']
              platform = f"{p['os']}/{p['architecture']}"
              if p['architecture'] == 'arm':
                  platform += '/' + p['variant']
              actual.add(platform)
          assert actual == expected, (actual, expected)
          assert 'sha256:' + hashlib.sha256(raw).hexdigest() == Path('dist/CONTAINER-DIGEST.txt').read_text().strip()
          PYCODE
          printf 'digest=%s\n' "$(cat dist/CONTAINER-DIGEST.txt)" >> "$GITHUB_OUTPUT"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: Verify complete native matrix and checksum every asset
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          targets = json.loads(Path('docs/platform-targets.json').read_text())
          version = json.loads(Path('js/package.json').read_text())['version']
          root = Path('dist')
          expected = {f"caj2pdf-v{version}-{t}.{'zip' if 'windows' in t else 'tar.gz'}" for t in targets}
          expected.update({f'caj2pdf-rust-{version}.tgz', 'caj2pdf_wasm.wasm', 'LICENSE', 'RELEASE-NOTES.md', 'caj2pdf-container.oci.tar', 'CONTAINER-DIGEST.txt'})
          assert {p.name for p in root.iterdir()} == expected, 'Incomplete or unexpected release assets'
          with (root / 'SHA256SUMS').open('w') as out:
              for name in sorted(expected):
                  with (root / name).open('rb') as file:
                      digest = hashlib.file_digest(file, 'sha256').hexdigest()
                  out.write(f'{digest}  {name}\n')
          PY
          (cd dist && sha256sum -c SHA256SUMS)
      # Attest only this run's gated build outputs, before adding the bundles.
      - name: Attest release files and checksum manifest
        id: files-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
      - name: Attest exact published container digest
        id: container-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/rwv/caj2pdf-rust
          subject-digest: ${{ steps.container.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Verify provenance before release publication
        env:
          GH_TOKEN: ${{ github.token }}
          FILE_BUNDLE: ${{ steps.files-provenance.outputs.bundle-path }}
          CONTAINER_BUNDLE: ${{ steps.container-provenance.outputs.bundle-path }}
          CONTAINER_DIGEST: ${{ steps.container.outputs.digest }}
        run: |
          policy=(--repo "$GITHUB_REPOSITORY"
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
            --signer-digest "$GITHUB_SHA" --deny-self-hosted-runners)
          for asset in dist/*; do
            gh attestation verify "$asset" --bundle "$FILE_BUNDLE" "${policy[@]}"
          done
          gh attestation verify "oci://ghcr.io/rwv/caj2pdf-rust@$CONTAINER_DIGEST" \
            --bundle-from-oci "${policy[@]}"
          # A modified artifact must be rejected by the same verification policy.
          cp dist/SHA256SUMS "$RUNNER_TEMP/tampered-checksums"
          printf '\nmodified\n' >> "$RUNNER_TEMP/tampered-checksums"
          if gh attestation verify "$RUNNER_TEMP/tampered-checksums" --bundle "$FILE_BUNDLE" "${policy[@]}"; then
            echo 'Modified artifact unexpectedly verified' >&2
            exit 1
          fi
          cp "$FILE_BUNDLE" dist/RELEASE-PROVENANCE.sigstore.json
          cp "$CONTAINER_BUNDLE" dist/CONTAINER-PROVENANCE.sigstore.json
      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "$RELEASE_TAG" --notes-file dist/RELEASE-NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --prerelease

  registries:
    name: Publish crates.io and npm
    needs: publish
    # Enable only after the owner has published the first versions and bound
    # all three packages to this workflow. No registry secrets are used.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && vars.REGISTRY_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist/
      - name: Check registry versions and npm OIDC support
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          rustup show active-toolchain
          node -e 'const [a,b,c]=require("child_process").execFileSync("npm",["--version"],{encoding:"utf8"}).trim().split(".").map(Number); if(a<11 || (a===11 && (b<5 || (b===5 && c<1)))) throw Error("npm >=11.5.1 required for OIDC")'
          version="${RELEASE_TAG#v}"
          tar -xOf "dist/caj2pdf-rust-$version.tgz" package/package.json > "$RUNNER_TEMP/npm-manifest.json"
          python3 - <<'PYCODE'
          import json, os, tomllib
          from pathlib import Path
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          manifest = json.loads((Path(os.environ['RUNNER_TEMP']) / 'npm-manifest.json').read_text())
          assert manifest['name'] == 'caj2pdf-rust' and manifest['version'] == version
          assert not manifest.get('private', False)
          assert manifest['repository']['url'] == 'git+https://github.com/rwv/caj2pdf-rust.git'
          for name in ('core', 'cli'):
              assert tomllib.loads(Path(f'crates/caj2pdf-{name}/Cargo.toml').read_text())['package']['version'] == version
          PYCODE
      - name: Obtain short-lived crates.io token
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish core followed by CLI
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish --locked -p caj2pdf-core -p caj2pdf-cli
      - name: Publish the tested npm tarball with provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm publish "./dist/caj2pdf-rust-${RELEASE_TAG#v}.tgz" --access public --provenance --ignore-scripts

  recover-npm:
    name: Recover verified npm release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.REGISTRY_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.npm_recovery_tag }}
    steps:
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.npm_recovery_tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download and verify original release tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          mkdir dist
          gh release download "$RELEASE_TAG" --dir dist \
            --pattern "caj2pdf-rust-${RELEASE_TAG#v}.tgz" \
            --pattern SHA256SUMS --pattern RELEASE-PROVENANCE.sigstore.json
          commit=$(git rev-parse HEAD)
          policy=(--repo "$GITHUB_REPOSITORY"
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
            --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$commit"
            --signer-digest "$commit" --deny-self-hosted-runners)
          for file in dist/*.tgz dist/SHA256SUMS; do
            gh attestation verify "$file" --bundle dist/RELEASE-PROVENANCE.sigstore.json "${policy[@]}"
          done
          python3 - <<'PYCODE'
          import hashlib, json, os, tarfile
          from pathlib import Path
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          archive = Path(f'dist/caj2pdf-rust-{version}.tgz')
          expected = {name: digest for digest, name in
                      (line.split() for line in Path('dist/SHA256SUMS').read_text().splitlines())}
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected[archive.name]
          with tarfile.open(archive) as package:
              manifest = json.load(package.extractfile('package/package.json'))
          assert manifest['name'] == 'caj2pdf-rust' and manifest['version'] == version
          assert not manifest.get('private', False)
          assert manifest['repository']['url'] == 'git+https://github.com/rwv/caj2pdf-rust.git'
          assert json.loads(Path('js/package.json').read_text())['version'] == version
          PYCODE
      - name: Publish original npm tarball with provenance
        run: npm publish "./dist/caj2pdf-rust-${RELEASE_TAG#v}.tgz" --access public --provenance --ignore-scripts
