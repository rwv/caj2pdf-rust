name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install independent PDF test validators
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qpdf mupdf-tools poppler-utils libjpeg-turbo-progs
          qpdf --version
          mutool -v
          pdfinfo -v
          pdfimages -v
          cjpeg -version
      - name: Check declared minimum Rust version
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --locked --workspace --all-targets
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Unit and integration tests
        run: cargo test --workspace --all-features --locked
      - name: Check generated MIT fixtures
        run: python3 scripts/generate_fixtures.py --check
      - name: Synthetic fixture tests
        run: python3 -m unittest discover -s tests/fixtures -p 'test_*.py' -v
      - name: Conformance harness tests
        run: python3 -m unittest discover -s tests/conformance -p 'test_*.py' -v
      - name: Report external HN/C8 container comparison as not run
        env:
          CAJ2PDF_CORPUS_DIR: ""
        run: |
          report="$(python3 tests/conformance/hnc8_container_compare.py --json)"
          printf '%s\n' "$report"
          python3 -c 'import json, sys; result = json.loads(sys.argv[1]); assert result["status"] == "NOT_RUN" and result["type0"]["passed"] == 0 and result["type0"]["not_run"] == 1400, result' "$report"
      - name: Report external JBIG1 pixel oracle as not run
        env:
          CAJ2PDF_CORPUS_DIR: ""
          CAJ2PDF_JBIG1_ORACLE_LIB: ""
        run: python3 scripts/jbig1_oracle.py --json
      - name: Report external JBIG2 directory inventory as not run
        env:
          CAJ2PDF_CORPUS_DIR: ""
        run: |
          python3 scripts/jbig2_directory_inventory.py --json | python3 -c 'import json, sys; report = json.load(sys.stdin); print(json.dumps(report)); assert report["status"] == "NOT_RUN" and report["checked_images"] == 0, report'
      - name: Report external JBIG2 pixel oracle as not run
        env:
          CAJ2PDF_CORPUS_DIR: ""
        run: |
          report="$(python3 scripts/jbig2_oracle.py --json)"
          printf '%s\n' "$report"
          python3 -c 'import json, sys; result = json.loads(sys.argv[1]); assert result["status"] == "NOT_RUN" and result["tool_agreements"] == 0' "$report"
      - name: Report external JBIG2 generic-only pixel oracle as not run
        env:
          CAJ2PDF_CORPUS_DIR: ""
        run: |
          report="$(python3 scripts/jbig2_generic_oracle.py --json)"
          printf '%s\n' "$report"
          python3 -c 'import json, sys; result = json.loads(sys.argv[1]); assert result["status"] == "NOT_RUN" and result["tool_agreements"] == 0' "$report"
      - name: Report external JBIG2 Rust generic parity as not run
        env:
          CAJ2PDF_CORPUS_DIR: ""
          CAJ2PDF_T88_H2_FIXTURE_FILE: ""
        run: |
          report="$(python3 scripts/jbig2_generic_parity.py --json)"
          printf '%s\n' "$report"
          python3 -c 'import json, sys; result = json.loads(sys.argv[1]); assert result["status"] == "NOT_RUN" and result["rust_matches"] == 0 and result["tool_agreements"] == 0, result' "$report"
      - name: Report external IAID compatibility as not run
        run: printf 'IAID_COMPATIBILITY status=NOT_RUN checked_cases=0\n'
      - name: Report external standard JBIG1 probe as not run
        run: python3 scripts/jbig1_standard_probe.py --json
      - name: Assert external type-0 row API parity is not run
        env:
          CAJ2PDF_CORPUS_DIR: ""
          CAJ2PDF_T82_VECTOR_FILE: ""
        run: |
          output="$(cargo test --locked -p caj2pdf-core --test qm_caj_oracle_external -- --nocapture 2>&1)"
          printf '%s\n' "$output"
          python3 -c 'import sys; assert "0 passed; 0 failed; 1 ignored" in sys.argv[1]' "$output"
          printf 'TYPE0_ROW_COMPATIBILITY status=NOT_RUN checked_images=0\n'
      - name: Report external corpus as not run
        env:
          CAJ2PDF_CORPUS_DIR: ""
        run: python3 scripts/conformance.py

  wasm:
    name: WASM build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check workspace examples and tests for WASM
        run: cargo check --locked --workspace --all-features --all-targets --target wasm32-unknown-unknown
      - name: Build WASM boundary
        run: cargo build --locked --release --all-features -p caj2pdf-wasm --target wasm32-unknown-unknown
      - name: Test browser and Node.js adapters on Node 22
        run: node --test js/test/*.test.mjs
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Test browser and Node.js adapters on Node 24
        run: node --test js/test/*.test.mjs

  licenses:
    name: MIT dependency and source audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cargo-deny
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Audit native dependency graph
        run: cargo deny --locked --all-features --target x86_64-unknown-linux-gnu check licenses sources
      - name: Audit WASM dependency graph
        run: cargo deny --locked --all-features --target wasm32-unknown-unknown check licenses sources
      - name: Flag vendored and generated source for review
        run: bash scripts/check-source-inventory.sh

  coverage:
    name: Line coverage (90% minimum; 100% target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install independent PDF test validators
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qpdf mupdf-tools poppler-utils libjpeg-turbo-progs
          qpdf --version
          mutool -v
          pdfinfo -v
          pdfimages -v
          cjpeg -version
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - name: Generate and check line coverage
        run: bash scripts/check-coverage.sh
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-line-coverage
          path: target/coverage/
          if-no-files-found: warn
