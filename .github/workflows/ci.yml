name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install independent PDF test validators
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qpdf mupdf-tools poppler-utils libjpeg-turbo-progs
          qpdf --version
          mutool -v
          pdfinfo -v
          pdfimages -v
          cjpeg -version
      - name: Check declared minimum Rust version
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --locked --workspace --all-targets
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked
      - name: Unit and integration tests
        run: cargo test --workspace --all-features --locked
      - name: Check fuzz targets compile
        run: cargo check --locked --manifest-path fuzz/Cargo.toml
      - name: Check generated MIT fixtures
        run: |
          python3 scripts/generate_fixtures.py --check
          python3 crates/caj2pdf-core/tests/fixtures/ttkn/generate.py --check
      - name: Synthetic fixture tests
        run: python3 -m unittest discover -s tests/fixtures -p 'test_*.py' -v

  wasm:
    name: WASM build
    runs-on: ubuntu-24.04
    env:
      # The runner image preinstalls Google Chrome; js/test/browser.test.mjs
      # drives it headless over the DevTools Protocol and fails under CI if
      # it is missing.
      CAJ2PDF_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install independent PDF validator for JavaScript output tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qpdf poppler-utils libjpeg-turbo-progs
          qpdf --version
      - name: Check the preinstalled Chromium for real-browser tests
        run: '"$CAJ2PDF_CHROME" --version'
      - name: Check workspace examples and tests for WASM
        run: cargo check --locked --workspace --all-features --all-targets --target wasm32-unknown-unknown
      - name: Build and stage the packaged WASM boundary
        run: |
          cargo build --locked --release --all-features -p caj2pdf-wasm --target wasm32-unknown-unknown
          node js/scripts/copy-wasm.mjs
      - name: Type-check JavaScript consumer declarations
        run: |
          typecheck_dir="$RUNNER_TEMP/caj2pdf-typecheck"
          npm install --prefix "$typecheck_dir" --ignore-scripts --no-audit --no-fund typescript@5.9.3 @types/node@22.18.6 undici-types@6.21.0
          node "$typecheck_dir/node_modules/typescript/bin/tsc" --strict --noEmit --module NodeNext --target ES2022 --lib ES2022,DOM,DOM.Iterable --typeRoots "$typecheck_dir/node_modules/@types" js/test/types/*.mts
          node "$typecheck_dir/node_modules/typescript/bin/tsc" --strict --noEmit --module NodeNext --target ES2022 --lib ES2022,WebWorker --typeRoots "$typecheck_dir/node_modules/@types" js/test/types-worker/*.mts
      - name: Measure JavaScript memory and temporary storage
        run: node js/scripts/measure-memory.mjs
      - name: Test the JavaScript API, packaging, and headless Chromium on Node 22
        run: node --test js/test/*.test.mjs
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Test the JavaScript API, packaging, and headless Chromium on Node 24
        run: node --test js/test/*.test.mjs

  licenses:
    name: MIT dependency and source audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-deny
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Audit all declared platform dependency graphs
        run: cargo deny --locked --all-features check licenses sources
      - name: Audit native dependency graph
        run: cargo deny --locked --all-features --target x86_64-unknown-linux-gnu check licenses sources
      - name: Audit Windows dependency graph
        run: cargo deny --locked --all-features --target x86_64-pc-windows-msvc check licenses sources
      - name: Audit WASM dependency graph
        run: cargo deny --locked --all-features --target wasm32-unknown-unknown check licenses sources
      - name: Audit RustSec advisories and banned crates
        run: cargo deny --locked --all-features check advisories bans
      - name: Flag vendored and generated source for review
        run: bash scripts/check-source-inventory.sh
      - name: Verify registry packages without publishing
        run: cargo publish --dry-run --locked -p caj2pdf-core -p caj2pdf-cli
      - name: Check relative Markdown links
        run: python3 scripts/check-doc-links.py

  coverage:
    # Keep this name aligned with the required branch-protection check. The
    # gate itself is the workspace floor in scripts/check-coverage.sh; rename
    # the job and the protection rule together when the floor is next moved.
    name: Line coverage (100% required)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install independent PDF test validators
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qpdf mupdf-tools poppler-utils libjpeg-turbo-progs
          qpdf --version
          mutool -v
          pdfinfo -v
          pdfimages -v
          cjpeg -version
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - name: Generate and check line coverage
        run: bash scripts/check-coverage.sh
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-line-coverage
          path: target/coverage/
          if-no-files-found: warn
