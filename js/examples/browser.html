<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>caj2pdf browser conversion</title>
  </head>
  <body>
    <h1>Convert CAJ, KDH, PDF, HN, or C8 in the browser</h1>
    <p>
      Conversion runs in a Worker that reads the selected file in bounded ranges. The PDF is
      streamed to a file you choose (<code>showSaveFilePicker</code>) or, where that API is
      missing, to a private OPFS file offered as a download.
      HN/C8 rendering is experimental.
    </p>
    <input id="file" type="file">
    <label><input id="bookmarks" type="checkbox" checked>Include bookmarks (disable for C8/HN-B)</label>
    <button id="run" type="button">Convert</button>
    <button id="cancel" type="button" disabled>Cancel</button>
    <button id="discard" type="button" hidden>Discard download</button>
    <pre id="result"></pre>
    <script type="module">
      import { convert, loadModule, webWritableSink } from "../browser.mjs";

      const modulePromise = loadModule();

      const result = document.querySelector("#result");
      const cancel = document.querySelector("#cancel");
      const run = document.querySelector("#run");
      const discard = document.querySelector("#discard");
      let download;

      async function discardDownload() {
        if (!download) return;
        await download.remove();
        URL.revokeObjectURL(download.link.href);
        download.link.remove();
        download = undefined;
        discard.hidden = true;
      }

      discard.onclick = async () => {
        run.disabled = discard.disabled = true;
        try {
          await discardDownload();
        } catch (error) {
          result.textContent = error.message;
        } finally {
          run.disabled = discard.disabled = false;
        }
      };

      async function openOutput(name) {
        if (typeof window.showSaveFilePicker === "function") {
          const handle = await window.showSaveFilePicker({ suggestedName: name });
          return { stream: await handle.createWritable(), finish: async () => null };
        }
        const root = await navigator.storage.getDirectory();
        const storageName = `output-${crypto.randomUUID()}.pdf`;
        const handle = await root.getFileHandle(storageName, { create: true });
        const dispose = () => root.removeEntry(storageName);
        try {
          return { stream: await handle.createWritable(), finish: () => handle.getFile(), dispose };
        } catch (error) {
          await dispose();
          throw error;
        }
      }

      run.addEventListener("click", async () => {
        const file = document.querySelector("#file").files[0];
        if (!file) {
          result.textContent = "Select a file first.";
          return;
        }
        const controller = new AbortController();
        run.disabled = discard.disabled = true;
        cancel.disabled = false;
        cancel.onclick = () => controller.abort();
        let writer;
        let output;
        try {
          await discardDownload();
          output = await openOutput(file.name.replace(/\.[^.]*$/, "") + ".pdf");
          writer = output.stream.getWriter();
          // convert() starts its own Worker; the page only awaits the sink.
          const report = await convert(await modulePromise, file, webWritableSink(writer), {
            signal: controller.signal,
            includeBookmarks: document.querySelector("#bookmarks").checked,
            progress: (fraction) => { result.textContent = `Converting: ${Math.round(fraction * 100)}%`; },
          });
          await writer.close();
          const saved = await output.finish();
          result.textContent = `Converted ${report.format.toUpperCase()}: ${report.pagesConverted} pages.`;
          if (saved) {
            const link = document.createElement("a");
            link.href = URL.createObjectURL(saved);
            link.download = file.name.replace(/\.[^.]*$/, "") + ".pdf";
            link.textContent = " Download";
            result.append(link, " Save the download, then discard it to remove the private output file.");
            download = { link, remove: output.dispose };
            discard.hidden = false;
          }
        } catch (error) {
          let cleanupError;
          try {
            // Private output is disposable: close it before removal so the
            // browser has completed the file operation and released its lock.
            // Abort user-selected output to preserve its previous contents.
            if (output?.dispose) await writer?.close();
            else await writer?.abort();
          } catch {
            await writer?.abort().catch(() => {});
          } finally {
            writer?.releaseLock();
            writer = undefined;
          }
          try {
            await output?.dispose?.();
          } catch (failure) {
            cleanupError = failure;
          }
          result.textContent = error.name === "AbortError"
            ? "Conversion cancelled."
            : `${error.code ?? error.name}: ${error.message}`;
          if (cleanupError) result.textContent += ` Output cleanup failed: ${cleanupError.message}`;
        } finally {
          writer?.releaseLock();
          run.disabled = discard.disabled = false;
          cancel.disabled = true;
        }
      });
    </script>
  </body>
</html>
