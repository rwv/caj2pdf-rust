# Dependency licenses are audited for both native Linux and browser/Node WASM.
# An SPDX `MIT OR ...` expression is accepted under its MIT grant; no other
# license is globally allowed. Keep the selected grant in the provenance list.
[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[licenses]
allow = ["MIT"]
confidence-threshold = 0.93
include-dev = true
include-build = true

[licenses.private]
ignore = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
