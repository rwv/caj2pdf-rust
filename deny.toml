# Dependency licenses are audited for both native Linux and browser/Node WASM.
# An SPDX `MIT OR ...` expression is accepted under its MIT grant; no other
# license is globally allowed. Keep the selected grant in the provenance list.
[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc", "i686-pc-windows-msvc", "i686-unknown-linux-gnu", "armv7-unknown-linux-gnueabihf", "riscv64gc-unknown-linux-gnu", "powerpc64le-unknown-linux-gnu", "s390x-unknown-linux-gnu", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "wasm32-unknown-unknown"]

[licenses]
allow = ["MIT"]
confidence-threshold = 0.93
include-dev = true
include-build = true

[licenses.private]
ignore = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
# Every ignored advisory must carry a reason, for example
# { id = "RUSTSEC-0000-0000", reason = "why it does not apply" }.
ignore = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Workspace path dependencies are not registry wildcards.
allow-wildcard-paths = true
