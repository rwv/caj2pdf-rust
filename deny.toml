# Dependency licenses are audited for both native Linux and browser/Node WASM.
# Permissive licenses are allowed; copyleft and source-available licenses are
# not. Project-owned source stays MIT. Keep the selected grant of any
# multi-licensed crate in the provenance list.
[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "i686-pc-windows-msvc",
    "i686-unknown-linux-gnu",
    "i586-unknown-linux-gnu",
    "armv7-unknown-linux-gnueabihf",
    "riscv64gc-unknown-linux-gnu",
    "powerpc64le-unknown-linux-gnu",
    "s390x-unknown-linux-gnu",
    "x86_64-unknown-freebsd",
    "aarch64-unknown-freebsd",
    "riscv64gc-unknown-freebsd",
    "powerpc64-unknown-freebsd",
    "armv5te-unknown-linux-gnueabi",
    "arm-unknown-linux-gnueabi",
    "arm-unknown-linux-gnueabihf",
    "armv7-unknown-linux-gnueabi",
    "powerpc-unknown-linux-gnu",
    "powerpc64-unknown-linux-gnu",
    "sparc64-unknown-linux-gnu",
    "loongarch64-unknown-linux-gnu",
    "loongarch64-unknown-linux-musl",
    "armv5te-unknown-linux-musleabi",
    "arm-unknown-linux-musleabi",
    "arm-unknown-linux-musleabihf",
    "armv7-unknown-linux-musleabi",
    "armv7-unknown-linux-musleabihf",
    "i586-unknown-linux-musl",
    "i686-unknown-linux-musl",
    "powerpc64-unknown-linux-musl",
    "powerpc64le-unknown-linux-musl",
    "riscv64gc-unknown-linux-musl",
    "mips-unknown-linux-gnu",
    "mipsel-unknown-linux-gnu",
    "mips64-unknown-linux-gnuabi64",
    "mips64el-unknown-linux-gnuabi64",
    "x86_64-unknown-netbsd",
    "x86_64-unknown-openbsd",
    "x86_64-unknown-illumos",
    "riscv32gc-unknown-linux-gnu",
    "powerpc-unknown-linux-musl",
    "s390x-unknown-linux-musl",
    "x86_64-linux-android",
    "i686-linux-android",
    "aarch64-unknown-netbsd",
    "aarch64-unknown-openbsd",
    "riscv64gc-unknown-openbsd",
    "wasm32-unknown-unknown",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
include-dev = true
include-build = true

[licenses.private]
ignore = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
# Every ignored advisory must carry a reason, for example
# { id = "RUSTSEC-0000-0000", reason = "why it does not apply" }.
ignore = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Workspace path dependencies are not registry wildcards.
allow-wildcard-paths = true
